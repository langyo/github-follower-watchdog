<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GitHub Follower Watchdog — hourly follower watch for your GitHub profile, recorded in git and published via GitHub Pages." />
    <meta name="theme-color" content="#0b0f1a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b0f1a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2322d3ee' stroke-width='2' opacity='0.9'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%23a78bfa' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='1.8' fill='%2322d3ee'/%3E%3C/svg%3E" />
    <title>GitHub Follower Watchdog</title>
    <style>
      html, body, #app { margin: 0; min-height: 100%; }
    </style>
    <script>
      // Theme mode picked pre-module to avoid a flash: saved choice wins,
      // otherwise follow the system (the site ships dark + light).
      try {
        var saved = localStorage.getItem("gfw-site-mode");
        var mode = saved === "light" || saved === "dark"
          ? saved
          : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.mode = mode;
      } catch (e) { document.documentElement.dataset.mode = "dark"; }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
